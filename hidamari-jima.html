<title>ひだまり島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D stage, light HUD on top (name + clock left, time tools right, hints / touch controls bottom) */
:root{
  --ink:#1f2b2e;
  --paper:rgba(255,250,240,.84);
  --line:rgba(31,43,46,.22);
  --accent:#e2603a;
  --accent-soft:rgba(226,96,58,.18);
  --sea:#cfe3ee;
  --font-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{position:relative;background:var(--sea);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.bottom{display:flex;gap:12px;justify-content:space-between;align-items:flex-end}
.card{pointer-events:auto;background:var(--paper);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:12px;padding:10px 14px;box-shadow:0 2px 14px rgba(20,30,40,.18)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand .name{font-size:20px;font-weight:700;letter-spacing:.06em}
.brand .clock{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.brand .phase{font-size:12px;opacity:.7;letter-spacing:.08em}
.tools{width:min(250px,100%);display:flex;flex-direction:column;gap:8px}
.tools label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;opacity:.8}
.tools input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
button:hover{background:var(--accent-soft)}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{flex:1;min-width:0;text-align:center;font-size:12px;letter-spacing:.04em;transition:opacity 1.2s;pointer-events:none}
.hint span{display:inline-block;background:var(--paper);border-radius:999px;padding:6px 14px;box-shadow:0 2px 10px rgba(20,30,40,.15)}
.hint.gone{opacity:0}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.mid .hint{flex:none;max-width:100%}
.chatlog{display:flex;flex-direction:column;gap:4px;align-items:center;max-width:100%;pointer-events:none}
.cl{margin:0;background:var(--paper);border-radius:999px;padding:4px 12px;font-size:12px;max-width:100%;overflow-wrap:anywhere;box-shadow:0 1px 8px rgba(20,30,40,.14)}
.cl b{color:var(--accent);font-weight:700}
.cl.me b{color:#2f7f8c}
.chat{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:100%;box-sizing:border-box;padding:8px 10px}
.chat .line{display:flex;gap:6px;width:min(340px,100%)}
.chat input[type=text]{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:8px;padding:6px 10px;-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%}
.chips button{padding:4px 10px}
.touch-only{display:none}
.stick,.jump{display:none;pointer-events:auto;touch-action:none}
.stick{position:relative;width:112px;height:112px;border-radius:50%;background:rgba(255,250,240,.35);border:2px solid rgba(255,250,240,.7)}
.stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,250,240,.9);box-shadow:0 2px 8px rgba(20,30,40,.25)}
.jump{width:72px;height:72px;border-radius:50%;background:rgba(226,96,58,.85);color:#fff;border:2px solid rgba(255,255,255,.8);font-weight:700;font-size:13px;padding:0}
@media (pointer:coarse){
  .stick{display:block}.jump{display:block}
  .kbd-only{display:none}.touch-only{display:inline}
}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0;max-width:100%}
.mpt{border:none;font:inherit;font-size:12px;letter-spacing:.06em;padding:7px 14px;cursor:pointer;color:var(--ink)}
.mpt[aria-pressed="true"]{background:var(--accent-soft)}
.mp{width:min(250px,100%);display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.mp input[type=text]{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.mp p{margin:0;font-size:12px;line-height:1.5;opacity:.85;min-height:1.5em}
.mpjoin{display:flex;gap:6px}
.mpjoin input{flex:1}
#fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px}
</style>

<div id="stage"></div>
<p id="fail" hidden>3D表示を開始できませんでした。ブラウザのハードウェアアクセラレーションが有効か確認してください。</p>
<div class="hud">
  <div class="row">
    <div class="col">
      <div class="card brand">
        <span class="name">ひだまり島</span>
        <span class="clock" id="clock">16:30</span>
        <span class="phase" id="phase">午後</span>
      </div>
      <button class="card mpt" id="mpToggle" aria-pressed="false">みんなで遊ぶ</button>
      <div class="card mp" id="mpPanel" hidden>
        <input type="text" id="mpName" maxlength="12" placeholder="なまえ" aria-label="なまえ" autocomplete="off">
        <button id="mpCreate">ルームを作る</button>
        <div class="mpjoin"><input type="text" id="mpCode" maxlength="5" placeholder="ルーム番号" aria-label="ルーム番号" autocomplete="off" autocapitalize="characters"><button id="mpJoin">参加</button></div>
        <div class="btns" id="mpRoom" hidden><button id="mpLink">招待リンクをコピー</button><button id="mpLeave">退出</button></div>
        <p id="mpStatus"></p>
      </div>
    </div>
    <div class="card tools">
      <label for="time"><span>時刻</span><span id="timeOut">16:30</span></label>
      <input id="time" type="range" min="0" max="24" step="0.05" value="16.5">
      <div class="btns">
        <button id="auto" aria-pressed="true">時間が進む</button>
        <button id="view">視点 V</button>
        <button id="home">戻る R</button>
        <button id="music" aria-pressed="false">♪ 音楽</button>
      </div>
    </div>
  </div>
  <div class="bottom">
    <div class="stick" id="stick" aria-label="移動スティック"><i id="knob"></i></div>
    <div class="mid"><button class="card mpt" id="talk" hidden></button><div class="chatlog" id="chatLog" aria-live="polite"></div>
      <form class="card chat" id="chatForm" hidden><div class="line"><input type="text" id="chatIn" maxlength="80" placeholder="自由に書いてEnterで送信" aria-label="メッセージ" autocomplete="off"><button type="submit">送信</button></div><div class="chips" id="chatChips"></div></form>
    <div class="hint" id="hint"><span><b class="kbd-only">WASD</b><b class="touch-only">スティック</b> 移動 ・ <span class="kbd-only" style="all:unset">Shift ダッシュ ・ Space ジャンプ ・ ドラッグで視点</span><span class="touch-only" style="all:unset">画面ドラッグで視点</span></span></div></div>
    <button class="jump" id="jump" aria-label="ジャンプ">ジャンプ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/*WORLD-BEGIN*/
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){$('fail').hidden=false;return;}

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const rand=rng(20261123);
const rr=(a,b)=>a+(b-a)*rand();
const pick=arr=>arr[Math.floor(rand()*arr.length)];
function hash2(ix,iy){let h=(Math.imul(ix,374761393)+Math.imul(iy,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);}
function fbm(x,y,o){let s=0,a=1,f=1,t=0;for(let i=0;i<o;i++){s+=(vnoise(x*f,y*f)*2-1)*a;t+=a;a*=0.5;f*=2.03;}return s/t;}
const C=hex=>new THREE.Color(hex);
const L=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));

/* ---------- renderer / scene ---------- */
const stage=$('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(err){$('fail').hidden=false;return;}
const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,coarse?1.5:2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xc3e2f3,70,360);
const camera=new THREE.PerspectiveCamera(62,1,0.1,2000);
function resize(){const w=stage.clientWidth||window.innerWidth,h=stage.clientHeight||window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);

/* ---------- world shape ---------- */
const CABIN={x:-12,z:16,y:3.0};
const POND={x:24,z:12};
const HILL={x:-26,z:-22};
function islandBase(x,z){
  const d=Math.hypot(x,z);
  const n=fbm(x*0.03+10,z*0.03,3);
  const mask=1-sstep(46,72,d+n*14);
  let land=3.0+fbm(x*0.05+3,z*0.05,3)*2.0+fbm(x*0.14,z*0.14,2)*0.5;
  const hx=x-HILL.x,hz=z-HILL.z;
  land+=8*Math.exp(-(hx*hx+hz*hz)/(2*11*11));
  let h=lerp(-5,land,mask);
  const px=x-POND.x,pz=z-POND.z;
  const p=Math.exp(-(px*px+pz*pz)/(2*6*6));
  return lerp(h,-1.6,clamp(p*1.6,0,1));
}
const TORII_Y=islandBase(HILL.x,HILL.z);
function H(x,z){
  let h=islandBase(x,z);
  h=lerp(h,CABIN.y,1-sstep(5.5,9.5,Math.hypot(x-CABIN.x,z-CABIN.z)));
  h=lerp(h,TORII_Y,1-sstep(2.8,5.2,Math.hypot(x-HILL.x,z-HILL.z)));
  return h;
}
function slopeAt(x,z){return Math.hypot(H(x+1,z)-H(x-1,z),H(x,z+1)-H(x,z-1))/2;}

/* dock + paths */
const dirOut=(()=>{const dx=CABIN.x+4.5-POND.x,dz=CABIN.z-POND.z,l=Math.hypot(dx,dz);return{x:dx/l,z:dz/l};})();
let S={x:POND.x-10,z:POND.z};
for(let r=0;r<30;r+=0.25){const x=POND.x+dirOut.x*r,z=POND.z+dirOut.z*r;if(H(x,z)>0.5){S={x,z};break;}}
const dirIn={x:-dirOut.x,z:-dirOut.z},perp={x:dirIn.z,z:-dirIn.x};
const S0={x:S.x+dirOut.x*0.8,z:S.z+dirOut.z*0.8};
const DOCK_L=8.2,DOCK_Y=0.5,DOCK_HW=1.1;
function ground(x,z){
  let h=H(x,z);
  const dx=x-S0.x,dz=z-S0.z,u=dx*dirIn.x+dz*dirIn.z,v=dx*perp.x+dz*perp.z;
  if(u>=0&&u<=DOCK_L&&Math.abs(v)<DOCK_HW)h=Math.max(h,DOCK_Y);
  const cx=x-CABIN.x,cz=z-CABIN.z;
  if((Math.abs(cx)<2.8&&Math.abs(cz)<2.3)||(cx>=2.8&&cx<3.25&&Math.abs(cz)<0.8))h=Math.max(h,CABIN.y+0.54);
  else if(cx>=3.0&&cx<5.4&&Math.abs(cz)<1.7)h=Math.max(h,CABIN.y+0.2);
  return h;
}
const PATHS=[
  [[CABIN.x+4.8,CABIN.z],[0,17.5],[8,15.5],[S.x,S.z]],
  [[CABIN.x-1,CABIN.z-3.6],[-17,2],[-22,-8],[-24.5,-17],[HILL.x,HILL.z]]
];
function segDist(px,pz,ax,az,bx,bz){const abx=bx-ax,abz=bz-az,t=clamp(((px-ax)*abx+(pz-az)*abz)/(abx*abx+abz*abz),0,1);return Math.hypot(px-(ax+abx*t),pz-(az+abz*t));}
function distToPath(x,z){let m=1e9;for(const p of PATHS)for(let i=0;i<p.length-1;i++)m=Math.min(m,segDist(x,z,p[i][0],p[i][1],p[i+1][0],p[i+1][1]));return m;}

/* ---------- terrain mesh (low-poly, per-face colour) ---------- */
const cGrassA=C(0x86c26e),cGrassB=C(0x5fa35c),cMeadow=C(0xb4cf72),cAutumn=C(0xdcb64e),cSand=C(0xefdfb0),cWet=C(0xd6c594),cFoam=C(0xfbf7ea),cDeep=C(0x4f8c88),cRock=C(0x938f86),cDirt=C(0xcaa878);
function terrainColor(x,z,h,ny,out){
  out.copy(cGrassA).lerp(cGrassB,vnoise(x*0.18+7,z*0.18));
  out.lerp(cMeadow,sstep(5.5,9.5,h)*0.8);
  out.lerp(cAutumn,sstep(0.58,0.72,vnoise(x*0.07+50,z*0.07-20))*0.55);
  out.lerp(cRock,sstep(0.86,0.7,ny)*0.9);
  out.lerp(cSand,sstep(1.1,0.55,h));
  out.lerp(cWet,sstep(0.25,0.0,h));
  out.lerp(cDeep,sstep(-0.3,-1.6,h));
  out.lerp(cFoam,sstep(-0.35,-0.15,h)*(1-sstep(0.0,0.15,h))*0.85);
  const dp=distToPath(x,z);
  out.lerp(cDirt,(1-sstep(0.9,1.9,dp))*0.9*sstep(0.4,1.0,h));
  return out;
}
const SIZE=200,SEG=128,STEP=SIZE/SEG;
const hs=new Float32Array((SEG+1)*(SEG+1));
for(let j=0;j<=SEG;j++)for(let i=0;i<=SEG;i++)hs[j*(SEG+1)+i]=H(-SIZE/2+i*STEP,-SIZE/2+j*STEP);
const tPos=new Float32Array(SEG*SEG*18),tCol=new Float32Array(SEG*SEG*18);
{
  let o=0;const col=new THREE.Color();
  const tri=(ax,ay,az,bx,by,bz,cx,cy,cz)=>{
    const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const l=Math.hypot(nx,ny,nz)||1;ny/=l;
    const mx=(ax+bx+cx)/3,mz=(az+bz+cz)/3,my=(ay+by+cy)/3;
    terrainColor(mx,mz,my,ny,col);
    tPos.set([ax,ay,az,bx,by,bz,cx,cy,cz],o);
    tCol.set([col.r,col.g,col.b,col.r,col.g,col.b,col.r,col.g,col.b],o);o+=9;
  };
  for(let j=0;j<SEG;j++)for(let i=0;i<SEG;i++){
    const x0=-SIZE/2+i*STEP,x1=x0+STEP,z0=-SIZE/2+j*STEP,z1=z0+STEP;
    const h00=hs[j*(SEG+1)+i],h10=hs[j*(SEG+1)+i+1],h01=hs[(j+1)*(SEG+1)+i],h11=hs[(j+1)*(SEG+1)+i+1];
    tri(x0,h00,z0,x0,h01,z1,x1,h10,z0);
    tri(x1,h10,z0,x0,h01,z1,x1,h11,z1);
  }
}
const tGeo=new THREE.BufferGeometry();
tGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));
tGeo.setAttribute('color',new THREE.BufferAttribute(tCol,3));
tGeo.computeVertexNormals();
const terrain=new THREE.Mesh(tGeo,new THREE.MeshLambertMaterial({vertexColors:true}));
terrain.receiveShadow=true;terrain.frustumCulled=false;scene.add(terrain);

/* ---------- sea ---------- */
const waterTime={value:0};
const waterMat=new THREE.MeshStandardMaterial({color:0x3fa7bd,roughness:0.3,metalness:0.0,transparent:true,opacity:0.78});
waterMat.onBeforeCompile=shader=>{
  shader.uniforms.uTime=waterTime;
  shader.vertexShader='uniform float uTime;\n'+shader.vertexShader.replace('#include <begin_vertex>',
    'vec3 transformed=vec3(position);transformed.z+=sin(position.x*0.15+uTime)*0.12+sin(position.y*0.2+uTime*1.3)*0.1;');
};
const water=new THREE.Mesh(new THREE.PlaneGeometry(900,900,90,90),waterMat);
water.rotation.x=-Math.PI/2;water.frustumCulled=false;scene.add(water);

/* far islands for depth */
{
  const m=L(0x6aa077);
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI*2+rr(-0.3,0.3),d=rr(170,260);
    const isl=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),m);
    isl.scale.set(rr(22,40),rr(9,16),rr(18,30));
    isl.position.set(Math.cos(a)*d,-3,Math.sin(a)*d);scene.add(isl);
  }
}

/* ---------- sky ---------- */
const sunDir=new THREE.Vector3(0,1,0);
const skyU={top:{value:new THREE.Color()},horizon:{value:new THREE.Color()},sunDir:{value:sunDir},sunCol:{value:new THREE.Color()},glow:{value:1}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.ShaderMaterial({
  uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 horizon;uniform vec3 sunDir;uniform vec3 sunCol;uniform float glow;varying vec3 vDir;'+
    'void main(){vec3 d=normalize(vDir);float h=clamp(d.y,0.0,1.0);vec3 col=mix(horizon,top,pow(h,0.55));'+
    'if(d.y<0.0)col=mix(horizon,horizon*0.85,clamp(-d.y*4.0,0.0,1.0));'+
    'float s=max(dot(d,sunDir),0.0);col+=sunCol*(pow(s,6.0)*0.35+pow(s,64.0)*0.5)*glow;gl_FragColor=vec4(col,1.0);}'
}));
sky.renderOrder=-3;sky.frustumCulled=false;scene.add(sky);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(16,16,12),new THREE.MeshBasicMaterial({color:0xfff3c8,fog:false,depthWrite:false}));
const moonDisc=new THREE.Mesh(new THREE.SphereGeometry(11,16,12),new THREE.MeshBasicMaterial({color:0xf2f0e2,fog:false,depthWrite:false}));
sunDisc.renderOrder=moonDisc.renderOrder=-2;sunDisc.frustumCulled=moonDisc.frustumCulled=false;scene.add(sunDisc,moonDisc);
const stars=(()=>{
  const n=700,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const u=rand()*Math.PI*2,y=Math.pow(rand(),0.7),r=Math.sqrt(1-y*y)*470;p[i*3]=Math.cos(u)*r;p[i*3+1]=y*470;p[i*3+2]=Math.sin(u)*r;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.8,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));
  s.frustumCulled=false;s.renderOrder=-2;scene.add(s);return s;
})();

/* lights */
const hemi=new THREE.HemisphereLight(0xcfe8ff,0x7a8a50,0.7);
const sun=new THREE.DirectionalLight(0xfff1d6,1.2);
sun.castShadow=true;sun.shadow.mapSize.set(coarse?1024:2048,coarse?1024:2048);
{const sc=sun.shadow.camera;sc.left=-45;sc.right=45;sc.top=45;sc.bottom=-45;sc.near=10;sc.far=240;}

/* ---------- geometry helpers ---------- */
function merge(parts){
  const arrs=[];let n=0;
  for(const p of parts){const g=p.g.index?p.g.toNonIndexed():p.g.clone();g.applyMatrix4(p.m);arrs.push(g.attributes.position.array);n+=g.attributes.position.array.length;}
  const out=new Float32Array(n);let o=0;for(const a of arrs){out.set(a,o);o+=a.length;}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(out,3));geo.computeVertexNormals();return geo;
}
const M4=(x,y,z,sx,sy,sz)=>{const m=new THREE.Matrix4();m.compose(new THREE.Vector3(x,y,z),new THREE.Quaternion(),new THREE.Vector3(sx||1,sy||1,sz||1));return m;};
const dummy=new THREE.Object3D();
function setInst(mesh,i,x,y,z,ry,sx,sy,sz,color,rx,rz){
  dummy.position.set(x,y,z);dummy.rotation.set(rx||0,ry,rz||0);dummy.scale.set(sx,sy,sz);dummy.updateMatrix();
  mesh.setMatrixAt(i,dummy.matrix);if(color!==undefined)mesh.setColorAt(i,color);
}
function finishInst(mesh,shadow){mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;mesh.frustumCulled=false;mesh.castShadow=!!shadow;mesh.receiveShadow=true;scene.add(mesh);}

function updateCabin(dt){
  const dxc=P.x-CABIN.x,dzc=P.z-CABIN.z;
  const inside=Math.abs(dxc)<2.85&&Math.abs(dzc)<2.35&&P.y>CABIN.y+0.3&&P.y<CABIN.y+2.2;
  if(inside&&!cabin.inside&&!cabin.welcomed){cabin.welcomed=true;addLog('わが家','おかえりなさい。ストーブがあたたかいよ。',false);}
  cabin.inside=inside;
  const near=Math.hypot(P.x-(CABIN.x+3.0),P.z-CABIN.z)<2.8;
  cabin.ang+=((near?1.5:0)-cabin.ang)*Math.min(1,dt*5);
  cabin.doorPivot.rotation.y=cabin.ang;
  const db=cabin.doorBox;
  if(cabin.ang<0.9){db.z0=CABIN.z-0.8;db.z1=CABIN.z+0.8;}else{db.z0=1e9;db.z1=1e9+1;}

function walkable(x,z){
  if(H(x,z)<1.0||Math.hypot(x,z)>70)return false;
  for(const c of circles)if(Math.hypot(x-c.x,z-c.z)<c.r+0.6)return false;

function addCritter(model,home,o){

function animRabbit(c,speed){
  const hop=speed>0?Math.abs(Math.sin(c.phase))*(c.mode==='flee'?0.4:0.18):0;
  c.g.position.set(c.x,c.y+hop,c.z);c.g.rotation.y=c.heading;c.g.rotation.x=speed>0?-Math.cos(c.phase)*0.2:0;
}
function animDeer(c,speed,dt){
  const sw=speed>0?Math.sin(c.phase)*0.55:0;
  c.legs[0].rotation.x=sw;c.legs[3].rotation.x=sw;c.legs[1].rotation.x=-sw;c.legs[2].rotation.x=-sw;
  const graze=speed===0&&Math.sin(T*0.12+c.h)>-0.3;
  const target=graze?2.2+Math.sin(T*0.7+c.h)*0.1:(speed>0?0.5:0.6+Math.sin(T*0.4+c.h)*0.08);
  c.neckA+=(target-c.neckA)*Math.min(1,dt*2.5);c.neck.rotation.x=c.neckA;
  c.g.position.set(c.x,c.y+(speed>0?Math.abs(Math.sin(c.phase))*0.03:0),c.z);c.g.rotation.y=c.heading;
}
function updateCritter(c,dt){
  const px=c.x-P.x,pz=c.z-P.z,dp=Math.hypot(px,pz)||1;
  let speed=0;
  if(dp<c.fleeR){
    if(c.mode!=='flee'||Math.hypot(c.tx-c.x,c.tz-c.z)<0.8){
      for(let k=0;k<6;k++){const a=Math.atan2(px,pz)+rr(-0.9,0.9),tx=c.x+Math.sin(a)*7,tz=c.z+Math.cos(a)*7;if(walkable(tx,tz)){c.tx=tx;c.tz=tz;break;}}
    }
    c.mode='flee';
  }else if(c.mode==='flee'){c.mode='idle';c.wait=rr(1,3);}
  if(c.mode==='idle'){
    c.wait-=dt;
    if(c.wait<=0){
      for(let k=0;k<8;k++){
        const a=rand()*6.28,r=rr(2,6),tx=c.x+Math.sin(a)*r,tz=c.z+Math.cos(a)*r;
        if(Math.hypot(tx-c.hx,tz-c.hz)<c.range&&walkable(tx,tz)){c.tx=tx;c.tz=tz;c.mode='walk';break;}
      }
      if(c.mode==='idle')c.wait=rr(1,3);
    }
  }
  if(c.mode!=='idle'){
    const dx=c.tx-c.x,dz=c.tz-c.z,d=Math.hypot(dx,dz);
    if(d<0.25){c.mode='idle';c.wait=rr(2,7);}
    else{
      speed=c.mode==='flee'?c.run:c.walk;
      const nx=c.x+dx/d*speed*dt,nz=c.z+dz/d*speed*dt;
      if(walkable(nx,nz)){c.x=nx;c.z=nz;}else{c.mode='idle';c.wait=rr(0.5,2);speed=0;}
      let df=Math.atan2(dx,dz)-c.heading;df=Math.atan2(Math.sin(df),Math.cos(df));c.heading+=df*Math.min(1,dt*8);
    }
  }
  c.y=lerp(c.y,ground(c.x,c.z),Math.min(1,dt*10));
  if(speed>0)c.phase+=dt*(c.rate?(c.mode==='flee'?c.rate*1.5:c.rate):speed*c.stride);
  c.anim(c,speed,dt);
}

let actx=null,master=null,musicBus=null,ambBus=null,windG=null,windF=null,waterG=null;
let musicOn=false,gestured=false,nextNote=0,step=0,melIdx=3;
const PENTA=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880,987.77,1174.66];
const PADS=[[146.83,220,277.18,369.99],[123.47,185,246.94,293.66],[196,246.94,293.66,369.99],[110,164.81,220,329.63]];
const TONES=[[293.66,369.99,440,587.33],[246.94,293.66,369.99,493.88],[196,246.94,293.66,392],[220,277.18,329.63,440]];
const BASS=[293.66,246.94,196,220];
function noiseBuf(sec){const n=Math.floor(actx.sampleRate*sec),b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function impulse(sec,decay){const n=Math.floor(actx.sampleRate*sec),b=actx.createBuffer(2,n,actx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
function loopNoise(type,freq,q,dest){
  const s=actx.createBufferSource();s.buffer=noiseBuf(4);s.loop=true;
  const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  s.connect(f);f.connect(dest);s.start(0,Math.random()*3);return f;
}
function slowMod(node,rate,depth){
  const o=actx.createOscillator();o.type='sine';o.frequency.value=rate;const g=actx.createGain();g.gain.value=depth;o.connect(g);g.connect(node.gain);o.start();
}
function initAudio(){
  if(actx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{actx=new AC();}catch(e){actx=null;return;}
  master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
  const rev=actx.createConvolver();rev.buffer=impulse(2.6,2.4);
  const revG=actx.createGain();revG.gain.value=0.45;rev.connect(revG);revG.connect(master);
  musicBus=actx.createGain();musicBus.gain.value=1;musicBus.connect(master);musicBus.connect(rev);
  ambBus=actx.createGain();ambBus.gain.value=1;ambBus.connect(master);
  windG=actx.createGain();windG.gain.value=0;windG.connect(ambBus);
  const wm=actx.createGain();wm.gain.value=0.6;wm.connect(windG);slowMod(wm,0.07,0.4);windF=loopNoise('bandpass',480,0.5,wm);
  waterG=actx.createGain();waterG.gain.value=0;waterG.connect(ambBus);
  const wv=actx.createGain();wv.gain.value=0.6;wv.connect(waterG);slowMod(wv,0.13,0.4);loopNoise('lowpass',900,0.7,wv);

/* one music-box tooth: soft attack, warm low-passed tone, short bright partials */
function box(t,f,v){
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;lp.Q.value=0.2;
  const g=actx.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.004);g.gain.exponentialRampToValueAtTime(0.0005,t+2.8);
  lp.connect(g);g.connect(musicBus);
  for(const p of[[1,1,2.6],[2,0.07,0.5]]){
    const o=actx.createOscillator(),pg=actx.createGain();o.type='sine';o.frequency.value=f*p[0];
    pg.gain.setValueAtTime(p[1],t);pg.gain.exponentialRampToValueAtTime(p[1]*0.01,t+p[2]);
    o.connect(pg);pg.connect(lp);o.start(t);o.stop(t+2.9);
  }

function pad(i,t){
  for(const f of PADS[i])for(const dt of[0.997,1.003]){
    const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f*dt;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.012,t+3);g.gain.setValueAtTime(0.012,t+6);g.gain.linearRampToValueAtTime(0,t+10);
    o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+10.5);
  }
}
/* 3/4 arpeggio over D - Bm - G - A, two bars per chord; a soft melody joins every second bar */
function schedule(){
  if(!actx||!musicOn)return;
  const now=actx.currentTime,night=nightK>0.5,dur=night?0.95:0.75;
  if(nextNote<now-1)nextNote=now+0.2;
  while(nextNote<now+0.6){
    const pos=step%6,bar=Math.floor(step/6)%2,ci=Math.floor(step/12)%4,t=nextNote+(Math.random()-0.5)*0.012;
    if(step%12===0)pad(ci,nextNote);
    const vel=(night?0.08:0.1)*(0.85+Math.random()*0.3);
    if(Math.random()>(night?0.2:0.08)){
      if(pos===0)box(t,BASS[ci],vel*1.1);
      else if(!(night&&pos>=4&&Math.random()<0.5))box(t,TONES[ci][[0,0,1,2,1,0][pos]],vel*(pos===3?1.05:0.85));
    }
    if(bar===1&&(pos===0||pos===3)&&Math.random()<0.8){
      melIdx=clamp(melIdx+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)],night?0:1,night?4:6);
      box(t+0.01,PENTA[melIdx],vel*1.25);
    }
    nextNote+=dur;step++;
  }
}
function updateAudio(){
  if(!actx||!musicOn)return;
  const t=actx.currentTime,g=ground(P.x,P.z),near=1-sstep(0.3,3.5,g),alt=clamp(P.y/10,0,1);

}

   lines:[['鳥居の先の丘は、島で一番見晴らしがいいですよ。','落ち葉を掃くのが日課なんです。'],['夕暮れ時の鳥居は、赤がいっそう映えます。'],['灯籠の明かりが、道を照らしてくれます。','星がきれいですね。']]},
  {name:'タケ',title:'旅の商人',coat:0x8a6a3c,pants:0x3b3b3b,hair:0x5a3a22,hat:'cap',pack:true,speed:1.5,
   plan:[{k:'path',pts:ROUTE,sp:1.5},restSpot(2),restSpot(3)],
   lines:[['島の端から端まで歩くのが仕事でね。','いい天気だと商売もはかどるよ。ここはお客さんが少ないけど。','小屋の煙突の煙が見えたら、そろそろお昼だ。'],['今日の仕事はおしまい。灯籠のそばで休むよ。'],['夜道は灯籠を頼りに歩くのさ。']]},
  {name:'ココ',title:'子ども',coat:0xf2c14e,pants:0x5a7fa8,hair:0xb5532e,scale:0.68,speed:2.4,
   plan:[{k:'wander',cx:-6,cz:10,r:14,sp:2.4},{k:'wander',cx:-6,cz:10,r:8,sp:2.0},restSpot(4,true)],
   lines:[['あっ、ちょうちょ!追いかけよう!','うさぎ、触らせてくれないの…。','鹿さんは大きいね!'],['まだ遊びたいなあ。'],['ねむい…でも星が見たいの。']]}
];
const villagers=[];
const phaseNow=()=>hour>=7&&hour<18?0:(hour>=18&&hour<21?1:2);
SPECS.forEach(s=>{
  const m=makeVillager(s),ph=phaseNow(),pl=s.plan[ph];
  let sx=pl.x,sz=pl.z;
  if(pl.k==='wander'){const p=randLand(pl.cx,pl.cz,pl.r);if(p){sx=p.x;sz=p.z;}else{sx=pl.cx;sz=pl.cz;}}
  if(pl.k==='path'){sx=pl.pts[0][0];sz=pl.pts[0][1];}
  const col={x:sx,z:sz,r:0.35};circles.push(col);
  const v=Object.assign({spec:s,name:s.name,title:s.title,lines:s.lines,speed:s.speed,x:sx,z:sz,y:ground(sx,sz),heading:rand()*6.28,tx:sx,tz:sz,wait:rr(0,3),
    pi:0,ph:rand()*6,sitK:0,stuck:0,talkT:0,greetCd:rr(4,12),li:0,col,lastPh:ph,bub:null,sitting:false},m);
  m.g.position.set(sx,v.y,sz);scene.add(m.g);villagers.push(v);
});
function speak(v){
  const set=v.lines[phaseNow()],text=set[v.li++%set.length];
  showBubble(v,v.g,text);addLog(v.name+'('+v.title+')',text,false);v.talkT=4;
}
let talkTarget=null;
function nearestVillager(maxD){
  let best=null,bd=maxD;
  for(const v of villagers){const d=Math.hypot(P.x-v.x,P.z-v.z);if(d<bd){bd=d;best=v;}}
  return best;
}
function talkNearest(){const v=nearestVillager(3.8);if(v)speak(v);}
{const tb=$('talk');tb.addEventListener('click',()=>{talkNearest();tb.blur();});}
function stepTo(v,tx,tz,sp,dt){
  const dx=tx-v.x,dz=tz-v.z,d=Math.hypot(dx,dz);
  if(d<0.05)return 0;
  const st=Math.min(d,sp*dt),nx=v.x+dx/d*st,nz=v.z+dz/d*st;
  let moved=false;
  if(okVill(nx,nz)){v.x=nx;v.z=nz;moved=true;}
  else if(okVill(nx,v.z)){v.x=nx;moved=true;}
  else if(okVill(v.x,nz)){v.z=nz;moved=true;}
  v.stuck=moved?0:v.stuck+dt;
  if(moved){let df=Math.atan2(dx,dz)-v.heading;df=Math.atan2(Math.sin(df),Math.cos(df));v.heading+=df*Math.min(1,dt*8);}
  return moved?sp:0;
}
function updateVillagers(dt){
  const ph=phaseNow();
  for(const v of villagers){
    const pl=v.spec.plan[ph];
    if(ph!==v.lastPh){v.lastPh=ph;v.pi=0;v.wait=0;v.stuck=0;v.tx=v.x;v.tz=v.z;}
    v.greetCd-=dt;if(v.talkT>0)v.talkT-=dt;
    const dpx=P.x-v.x,dpz=P.z-v.z,dp=Math.hypot(dpx,dpz);
    if(dp<5&&v.greetCd<=0){v.greetCd=55;speak(v);}
    let sp=0,arrived=false;
    if(v.talkT>0){
      let df=Math.atan2(dpx,dpz)-v.heading;df=Math.atan2(Math.sin(df),Math.cos(df));v.heading+=df*Math.min(1,dt*6);
    }else if(pl.k==='spot'){
      const d=Math.hypot(pl.x-v.x,pl.z-v.z);
      if(d>0.35){
        sp=stepTo(v,pl.x,pl.z,v.speed,dt);
        if(v.stuck>4&&dp>12){v.x=pl.x;v.z=pl.z;v.stuck=0;}
      }else{
        arrived=true;
        let df=pl.face-v.heading;df=Math.atan2(Math.sin(df),Math.cos(df));v.heading+=df*Math.min(1,dt*4);
      }
    }else if(pl.k==='wander'){
      if(v.wait>0){v.wait-=dt;}
      else{
        const d=Math.hypot(v.tx-v.x,v.tz-v.z);
        if(d<0.3||v.stuck>1){
          v.stuck=0;
          if(d<0.3)v.wait=rr(1.5,6);
          for(let k=0;k<10;k++){
            const a=rand()*6.28,r=rr(2,5),nx=v.x+Math.sin(a)*r,nz=v.z+Math.cos(a)*r;
            if(Math.hypot(nx-pl.cx,nz-pl.cz)<pl.r&&okVill(nx,nz)){v.tx=nx;v.tz=nz;break;}
          }
        }else sp=stepTo(v,v.tx,v.tz,pl.sp,dt);
      }
    }else if(pl.k==='path'){
      if(v.wait>0){v.wait-=dt;}
      else{
        const q=pl.pts[v.pi%pl.pts.length],d=Math.hypot(q[0]-v.x,q[1]-v.z);
        if(d<0.8){v.pi=(v.pi+1)%pl.pts.length;v.wait=rr(2,7);}
        else{sp=stepTo(v,q[0],q[1],pl.sp,dt);if(v.stuck>3){v.pi=(v.pi+1)%pl.pts.length;v.stuck=0;}}
      }
    }
    if(sp>0)v.ph+=dt*sp*1.9;
    v.sitting=arrived&&!!pl.sit;
    v.sitK+=((v.sitting?1:0)-v.sitK)*Math.min(1,dt*5);
    const swing=sp>0?Math.sin(v.ph)*0.8:0;
    const rodOn=arrived&&!!pl.rod,broomOn=!!pl.broom;
    v.legs[0].rotation.x=lerp(swing,-1.5,v.sitK);v.legs[1].rotation.x=lerp(-swing,-1.5,v.sitK);
    if(rodOn){v.arms[0].rotation.x=v.arms[1].rotation.x=-1.1;}
    else if(broomOn){v.arms[0].rotation.x=-0.7+Math.sin(T*2.6)*0.25;v.arms[1].rotation.x=-0.7-Math.sin(T*2.6)*0.25;}
    else{v.arms[0].rotation.x=-swing*0.9;v.arms[1].rotation.x=swing*0.9;}
    if(v.rodG){v.rodG.visible=v.line.visible=v.fl.visible=rodOn;if(rodOn)v.fl.position.y=0.02+Math.sin(T*1.6)*0.03;}
    if(v.broom)v.broom.visible=broomOn;
    v.inner.position.y=-0.45*v.sitK;
    v.y+=(ground(v.x,v.z)-v.y)*Math.min(1,dt*10);
    v.g.position.set(v.x,v.y,v.z);v.g.rotation.y=v.heading;
    v.col.x=v.x;v.col.z=v.z;
  }
  const near=nearestVillager(3.8),tb=$('talk');
  if(near!==talkTarget){
    talkTarget=near;
    if(near){tb.textContent=near.name+'と話す(E)';tb.hidden=false;}else tb.hidden=true;
  }
}

/* ---------- loop ---------- */
const tmpV=new THREE.Vector3();
let last=performance.now(),T=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  if(auto&&!sliding){hour=(hour+dt*0.06)%24;slider.value=hour.toFixed(2);}
  applyTime(hour);

  /* player */
  let mx=0,mz=0;
  if(keys.has('KeyW')||keys.has('ArrowUp'))mz+=1;
  if(keys.has('KeyS')||keys.has('ArrowDown'))mz-=1;
  if(keys.has('KeyD')||keys.has('ArrowRight'))mx+=1;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))mx-=1;
  mx+=joy.x;mz-=joy.y;
  const len=Math.hypot(mx,mz);if(len>1){mx/=len;mz/=len;}
  const fx=Math.sin(yaw),fz=Math.cos(yaw),rx=-Math.cos(yaw),rz=Math.sin(yaw);
  const dx=fx*mz+rx*mx,dz=fz*mz+rz*mx;
  const g0=ground(P.x,P.z),inWater=g0<-0.4;
  const sprint=keys.has('ShiftLeft')||keys.has('ShiftRight')||Math.hypot(joy.x,joy.y)>0.92;
  const speed=(sprint?9.5:5.2)*(inWater?0.5:1);
  moving=len>0.05;
  let nx=P.x+dx*speed*dt,nz=P.z+dz*speed*dt;
  for(const c of circles){const ox=nx-c.x,oz=nz-c.z,d=Math.hypot(ox,oz),mn=c.r+0.4;if(d<mn&&d>1e-4){nx=c.x+ox/d*mn;nz=c.z+oz/d*mn;}}
  for(const b of boxes){
    const cx=clamp(nx,b.x0,b.x1),cz=clamp(nz,b.z0,b.z1),ox=nx-cx,oz=nz-cz,d=Math.hypot(ox,oz);
    if(d<0.4){
      if(d>1e-4){nx=cx+ox/d*0.4;nz=cz+oz/d*0.4;}
      else{const l=nx-b.x0,r=b.x1-nx,t=nz-b.z0,bt=b.z1-nz,m=Math.min(l,r,t,bt);if(m===l)nx=b.x0-0.4;else if(m===r)nx=b.x1+0.4;else if(m===t)nz=b.z0-0.4;else nz=b.z1+0.4;}
    }
  }
  const wd=Math.hypot(nx,nz);if(wd>82){nx*=82/wd;nz*=82/wd;}
  P.x=nx;P.z=nz;
  const g=ground(P.x,P.z),water2=g<-0.4;
  if(water2){
    P.vy=0;P.grounded=true;P.y=lerp(P.y,-0.5+Math.sin(T*2)*0.04,Math.min(1,dt*10));
  }else{
    if((keys.has('Space')||jumpTouch)&&P.grounded){P.vy=8.5;P.grounded=false;}
    P.vy-=22*dt;P.y+=P.vy*dt;
    if(P.y<=g){P.y=g;P.vy=0;P.grounded=true;}
    else if(P.grounded&&P.vy<=0&&P.y-g<0.4){P.y=g;P.vy=0;}
    else if(P.y>g+0.01)P.grounded=false;
  }
  if(moving){
    const target=Math.atan2(dx,dz);let diff=target-heroYaw;diff=Math.atan2(Math.sin(diff),Math.cos(diff));heroYaw+=diff*Math.min(1,dt*12);
    walkPhase+=dt*speed*1.7;
  }
  const sw=moving&&P.grounded?Math.sin(walkPhase)*0.8:0;
  legs[0].rotation.x=sw;legs[1].rotation.x=-sw;arms[0].rotation.x=-sw*0.9;arms[1].rotation.x=sw*0.9;
  hero.position.set(P.x,P.y+(moving&&P.grounded?Math.abs(Math.sin(walkPhase))*0.05:0),P.z);
  hero.rotation.y=heroYaw;
  const wet=g<0.12;
  ripple.visible=wet&&P.grounded&&curDist>1;
  if(ripple.visible){const s=1+((T*1.2)%1)*1.4;ripple.position.set(P.x,0.04,P.z);ripple.scale.set(s,s,s);ripple.material.opacity=0.6*(1-((T*1.2)%1));}

  /* camera */
  curDist+=((fp?0.001:(cabin.inside?Math.min(viewDist,4.2):viewDist))-curDist)*Math.min(1,dt*8);
  hero.visible=curDist>1.0;
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  const dirX=fx*cp,dirY=-sp,dirZ=fz*cp;
  const tx=P.x,ty=P.y+1.55,tz=P.z;
  let cx=tx-dirX*curDist,cy=ty-dirY*curDist,cz=tz-dirZ*curDist;
  const cg=ground(cx,cz)+0.6;if(cy<cg)cy=cg;
  camera.position.set(cx,cy,cz);
  camera.lookAt(cx+dirX,cy+dirY,cz+dirZ);

  /* follow lights / sky */
  sun.position.set(tx+sunDir.x*120,ty+sunDir.y*120,tz+sunDir.z*120);sun.target.position.set(tx,ty,tz);
  moon.position.set(tx-sunDir.x*100,ty-sunDir.y*100,tz-sunDir.z*100);moon.target.position.set(tx,ty,tz);
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  sunDisc.position.set(cx+sunDir.x*430,cy+sunDir.y*430,cz+sunDir.z*430);
  moonDisc.position.set(cx-sunDir.x*430,cy-sunDir.y*430,cz-sunDir.z*430);
  waterTime.value=T;

  /* clouds */
  for(const c of clouds){c.position.x+=c.userData.v*dt;if(c.position.x>250)c.position.x=-250;}

  /* smoke */
  const sm=lerp(0.35,0.9,clamp(dayK+duskK*0.8,0,1));
  for(const s of smoke){
    const p=(T*0.12+s.userData.ph)%1;
    s.position.set(cabinParts.chimneyTop.x+p*2.4+Math.sin(T+s.userData.ph*9)*0.2,cabinParts.chimneyTop.y+p*6,cabinParts.chimneyTop.z+p*0.8);
    const sc=0.7+p*2.8;s.scale.set(sc,sc,1);s.material.opacity=Math.sin(p*Math.PI)*0.45;s.material.color.setScalar(sm);
  }

  /* petals */
  for(let i=0;i<NP;i++){
    const o=petalOff[i];
    o.y-=o.v*dt;o.x+=Math.sin(T*0.8+o.ph)*dt*0.9+0.5*dt;o.z+=Math.cos(T*0.6+o.ph)*dt*0.6;
    if(o.y<0)o.y+=11;
    if(o.x>16)o.x-=32;if(o.x<-16)o.x+=32;if(o.z>16)o.z-=32;if(o.z<-16)o.z+=32;
    petalPos[i*3]=P.x+o.x;petalPos[i*3+1]=P.y-1+o.y;petalPos[i*3+2]=P.z+o.z;
  }
  petalGeo.attributes.position.needsUpdate=true;

  /* fireflies */
  if(glowK>0.01){
    for(let i=0;i<NFF;i++){
      const b=ffBase[i];if(!b)break;
      ffPos[i*3]=b.x+Math.sin(T*b.sp+b.ph)*1.2;ffPos[i*3+1]=b.y+Math.sin(T*b.sp*1.7+b.ph)*0.5;ffPos[i*3+2]=b.z+Math.cos(T*b.sp*0.9+b.ph)*1.2;
    }
    ffGeo.attributes.position.needsUpdate=true;
  }
  fireflies.visible=glowK>0.01;

  updateCreatures(dt);
  updateVillagers(dt);
  updateCabin(dt);
  updateAudio();
  updateNet(dt);

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
applyTime(hour);
requestAnimationFrame(frame);
})();
/*WORLD-END*/
</script>
